name: Publikacja PWA na GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; trwające pozwalamy dokończyć
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publikujemy wyłącznie katalog web/ — Worker nie ma czego szukać w Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - id: wdrozenie
        uses: actions/deploy-pages@v4
