name: Wdrożenie Workera na Cloudflare

# Front (katalog web/) publikuje się sam na GitHub Pages, ale backend to osobna
# usługa i trzeba go wdrożyć osobno. Bez tego telefon dostaje nowy interfejs,
# który puka do starego serwera — i widzi "Nieznana trasa".
#
# Ten przepływ działa tylko wtedy, gdy w repozytorium jest sekret
# CLOUDFLARE_API_TOKEN. Bez niego kończy się bez błędu i bez wdrożenia,
# żeby nie migać czerwonym krzyżykiem, gdy backend wdraża Workers Builds.

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: sekret
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          else
            echo "jest=nie" >> "$GITHUB_OUTPUT"
            echo "::notice::Brak sekretu CLOUDFLARE_API_TOKEN — pomijam wdrożenie Workera."
          fi

      - if: steps.sekret.outputs.jest == 'tak'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: steps.sekret.outputs.jest == 'tak'
        working-directory: worker
        run: npm ci --omit=optional || npm install

      # Testy przed wdrożeniem — na telefonie nie ma jak ich odpalić ręcznie
      - if: steps.sekret.outputs.jest == 'tak'
        working-directory: worker
        run: npm test

      - if: steps.sekret.outputs.jest == 'tak'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
