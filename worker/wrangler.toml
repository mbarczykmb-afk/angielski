name = "angielski-ai"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Baza D1. Identyfikator jest jawny z natury — to nazwa zasobu, nie poswiadczenie:
# bez dostepu do konta Cloudflare nic nie daje. Tu musi byc, zeby automatyczne
# wdrozenie z GitHuba wiedzialo, do ktorej bazy sie podpiac.
[[d1_databases]]
binding = "DB"
database_name = "angielski-ai"
database_id = "4a74fd4b-d4e8-4695-a7da-925b07600f1d"

[vars]
# Adres, z którego przeglądarka może wołać API.
#
# Uwaga na wagę tego ustawienia: token sesji leży w localStorage, a nie w ciasteczku,
# więc obca strona i tak nie mogłaby go użyć. To jest porządek, nie zamek — prawdziwą
# ochroną są token sesji i KOD_REJESTRACJI.
#
# Gdyby po zmianie aplikacja przestała się łączyć, wpisz tu z powrotem "*"
# i wdróż ponownie — to cofa całą zmianę.
DOZWOLONY_ORIGIN = "https://mbarczykmb-afk.github.io"

# OAuth do kopii na Dysku Google (opcjonalne — bez tego działa reszta aplikacji).
# Client ID jest jawny z natury, więc może zostać tutaj. Sekret idzie przez wrangler secret.
GOOGLE_CLIENT_ID = ""

# Model Gemini używany do tur rozmowy, gdy wybierzesz go w Ustawieniach.
# Google zmienia nazwy modeli częściej niż wychodzą wersje tej aplikacji —
# jeśli zobaczysz błąd "Gemini nie zna modelu", wpisz tutaj aktualną nazwę.
GEMINI_MODEL = "gemini-flash-latest"

# Sekrety (NIE trzymamy ich w tym pliku):
#   npx wrangler secret put ANTHROPIC_API_KEY   — klucz z console.anthropic.com
#   npx wrangler secret put KOD_REJESTRACJI     — hasło do zakładania nowych profili (opcjonalne, ale zalecane)
#   npx wrangler secret put GOOGLE_CLIENT_SECRET — sekret OAuth z Google Cloud Console (opcjonalne)
#   npx wrangler secret put GEMINI_API_KEY      — klucz z aistudio.google.com (opcjonalne)
#   npx wrangler secret put PEXELS_API_KEY      — darmowy klucz z pexels.com/api (opcjonalne)
#
# PEXELS_API_KEY dotyczy zdjęć do zadania 2 na maturze ustnej. Bez niego zdjęcia
# lecą z Wikimedia Commons, które nie wymaga żadnego klucza — działa od razu,
# ale trafia w temat wyraźnie gorzej. Sekrety da się też dodać w panelu
# Cloudflare: Workers & Pages → angielski-ai → Settings → Variables and Secrets.
